<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExamGuard | Login</title>

    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Roboto',sans-serif;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#eef2ff,#dbeafe);
        }

        .card{
            width:400px;
            background:white;
            padding:35px;
            border-radius:15px;
            box-shadow:0 10px 25px rgba(0,0,0,.15);
        }

        h1{
            color:#2563eb;
            text-align:center;
            margin-bottom:5px;
        }

        p{
            text-align:center;
            color:gray;
            margin-bottom:25px;
        }

        label{
            display:block;
            margin-bottom:8px;
            font-weight:500;
        }

        input{
            width:100%;
            padding:12px;
            margin-bottom:20px;
            border:1px solid #ccc;
            border-radius:8px;
        }

        input:focus{
            outline:none;
            border-color:#2563eb;
        }

        button{
            width:100%;
            padding:13px;
            background:#2563eb;
            color:white;
            border:none;
            border-radius:8px;
            cursor:pointer;
            font-size:16px;
        }

        button:hover{
            background:#1d4ed8;
        }

        .bottom{
            text-align:center;
            margin-top:20px;
        }

    </style>

</head>

<body>

<div class="card">

<h1>ExamGuard</h1>

<p>Candidate Login</p>

<form method="POST">

<label>Email</label>

<input type="email" name="email" required>

<label>Password</label>

<input type="password" name="password" required>

<button type="submit">
Login
</button>

</form>

<div class="bottom">

Don't have an account?

<a href="/register">Register</a>

</div>

</div>

</body>
</html>
