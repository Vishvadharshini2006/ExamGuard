<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExamGuard | Candidate Registration</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Roboto',sans-serif;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#eef2ff,#dbeafe);
        }

        .container{
            width:100%;
            max-width:430px;
            padding:20px;
        }

        .card{

            background:#fff;
            padding:35px;
            border-radius:18px;
            box-shadow:0 10px 30px rgba(0,0,0,0.12);

        }

        .logo{

            text-align:center;
            margin-bottom:10px;

        }

        .logo h1{

            color:#2563eb;
            font-size:30px;

        }

        .logo p{

            color:#666;
            font-size:14px;
            margin-top:6px;

        }

        h2{

            text-align:center;
            margin-bottom:25px;
            color:#222;

        }

        .form-group{

            margin-bottom:18px;

        }

        label{

            display:block;
            margin-bottom:8px;
            font-weight:500;
            color:#333;

        }

        input{

            width:100%;
            padding:13px;
            border:1px solid #cbd5e1;
            border-radius:8px;
            font-size:15px;
            transition:0.3s;

        }

        input:focus{

            outline:none;
            border-color:#2563eb;
            box-shadow:0 0 8px rgba(37,99,235,0.25);

        }

        input:hover{

            border-color:#2563eb;

        }

        input:invalid:focus{

            border-color:red;

        }

        .register-btn{

            width:100%;
            padding:14px;
            border:none;
            border-radius:8px;
            background:#2563eb;
            color:white;
            font-size:16px;
            font-weight:bold;
            cursor:pointer;
            transition:0.3s;

        }

        .register-btn:hover{

            background:#1d4ed8;
            transform:translateY(-2px);

        }

        .footer{

            margin-top:20px;
            text-align:center;
            color:#555;
            font-size:14px;

        }

        .footer a{

            color:#2563eb;
            text-decoration:none;
            font-weight:500;

        }

        .footer a:hover{

            text-decoration:underline;

        }

        @media(max-width:500px){

            .card{

                padding:25px;

            }

        }

    </style>

</head>
<body>

<div class="container">

    <div class="card">

        <div class="logo">

            <h1>ExamGuard</h1>
            <p>Online Exam Monitoring & Integrity Analytics Platform</p>

        </div>

        <h2>Candidate Registration</h2>

        <form method="POST">

            <div class="form-group">

                <label for="full_name">Full Name</label>

                <input
                    type="text"
                    id="full_name"
                    name="full_name"
                    placeholder="Enter your full name"
                    required>

            </div>

            <div class="form-group">

                <label for="email">Email Address</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required>

            </div>

            <div class="form-group">

                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create a password"
                    required>

            </div>

            <button class="register-btn" type="submit">
                Register
            </button>

        </form>

        <div class="footer">

            Already have an account?
            <a href="/login">Login</a>

        </div>

    </div>

</div>

</body>
</html>
